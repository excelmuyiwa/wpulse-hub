  <title>WPulse</title>
  <!-- Animated copy of wpulse-icon-nobg.svg (same artwork). The W has no separate pulse-line shape, so it
       breathes (scale 1 to 1.03) while a soft teal glow layer behind it fades in and out. Only transform
       and opacity are animated; the glow is a separate blurred layer. Pure CSS, no script. -->
  <defs>
    <style type="text/css">
      <![CDATA[
      .fil1 {fill:#168782}
      .fil2 {fill:#117674}
      .fil3 {fill:#2BC5B4}
      .fil4 {fill:#1AADA0}
      .fil5 {fill:#2CD4C4}
      .glow-shape {fill:#2BD4C7}
      .breathe { transform-box: fill-box; transform-origin: 50% 50%; animation: breathe 4s ease-in-out infinite; }
      .glow { opacity: 0.12; animation: glow 4s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
      @keyframes glow { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.6; } }
      @media (prefers-reduced-motion: reduce) {
        .breathe, .glow { animation: none; }
        .glow { opacity: 0.3; }
      }
      ]]>
    </style>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
